# .github/release.yml

changelog:
  exclude:
    labels:
      - ignore-for-release

  categories:
    - title: Breaking Changes
      labels:
        - breaking-change

    - title: New Features
      labels:
        - enhancement
        - feature

    - title: Bug Fixes
      labels:
        - bug
        - bugfix

    - title: Documentation
      labels:
        - documentation

    - title: Other Changes
      labels:
        - "*"
