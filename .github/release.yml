changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]

  categories:
    - title: "New Features"
      labels:
        - feature
        - enhancement

    - title: "Bug Fixes"
      labels:
        - bug

    - title: "Improvements"
      labels:
        - improvement
        - performance

    - title: "Maintenance"
      labels:
        - documentation
        - maintenance

    - title: "Other Changes"
      labels:
        - "*"

